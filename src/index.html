<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Three.js Firework</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <canvas class="webgl"></canvas>

    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <aside class="controls-panel">
      <button
        class="controls-toggle"
        type="button"
        aria-label="Toggle controls"
      >
        <span class="controls-toggle-icon">☰</span>

        <span>Controls</span>

        <span class="controls-arrow">‹</span>
      </button>

      <div class="controls-content">
        <!-- =================================================
             ACTIONS
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Actions</span>
          </div>

          <button class="reset-firework control-button primary" type="button">
            <span>↻</span>
            Reset
          </button>
        </section>

        <!-- =================================================
             ANIMATION
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Animation</span>
          </div>

          <label class="control-row">
            <span class="control-label">Duration</span>

            <span class="control-value" data-value="fireworksDuration">
              1.40s
            </span>

            <input
              type="range"
              min="0.2"
              max="5"
              step="0.05"
              data-setting="fireworksDuration"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Tail growth</span>

            <span class="control-value" data-value="tailGrowthDuration">
              0.20s
            </span>

            <input
              type="range"
              min="0.01"
              max="2"
              step="0.01"
              data-setting="tailGrowthDuration"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Tail power</span>

            <span class="control-value" data-value="tailGrowthPower">
              2.50
            </span>

            <input
              type="range"
              min="0.5"
              max="6"
              step="0.1"
              data-setting="tailGrowthPower"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Fade before end</span>

            <span class="control-value" data-value="fadeOutBeforeEnd">
              0.80s
            </span>

            <input
              type="range"
              min="0"
              max="1.4"
              step="0.05"
              data-setting="fadeOutBeforeEnd"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Fade duration</span>

            <span class="control-value" data-value="fadeOutDuration">
              0.60s
            </span>

            <input
              type="range"
              min="0.01"
              max="2"
              step="0.05"
              data-setting="fadeOutDuration"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Drop delay</span>

            <span class="control-value" data-value="maxDropDelay"> 0.00s </span>

            <input
              type="range"
              min="0"
              max="1"
              step="0.01"
              data-setting="maxDropDelay"
            />
          </label>
        </section>

        <!-- =================================================
             SHAPE
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Shape</span>
          </div>

          <label class="control-row">
            <span class="control-label">Min radius</span>

            <span class="control-value" data-value="minRadius"> 2.70 </span>

            <input
              type="range"
              min="0.5"
              max="5"
              step="0.05"
              data-setting="minRadius"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Max radius</span>

            <span class="control-value" data-value="maxRadius"> 3.30 </span>

            <input
              type="range"
              min="0.5"
              max="6"
              step="0.05"
              data-setting="maxRadius"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Target offset</span>

            <span class="control-value" data-value="targetOffset"> 0.35 </span>

            <input
              type="range"
              min="0"
              max="2"
              step="0.01"
              data-setting="targetOffset"
            />
          </label>
        </section>

        <!-- =================================================
             PARTICLES
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Particles</span>
          </div>

          <label class="control-row">
            <span class="control-label">Particle size</span>

            <span class="control-value" data-value="particleSize"> 70 </span>

            <input
              type="range"
              min="1"
              max="150"
              step="1"
              data-setting="particleSize"
            />
          </label>

          <div class="geometry-settings">
            <label class="number-field">
              <span>Rays</span>

              <input
                type="number"
                min="3"
                max="40"
                step="1"
                data-setting="dropCount"
                value="14"
              />
            </label>

            <label class="number-field">
              <span>Slices</span>

              <input
                type="number"
                min="3"
                max="40"
                step="1"
                data-setting="sliceCount"
                value="15"
              />
            </label>
          </div>

          <button class="apply-geometry control-button" type="button">
            Apply geometry
          </button>
        </section>

        <!-- =================================================
             CAMERA
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Camera</span>
          </div>

          <label class="control-row">
            <span class="control-label">Field of view</span>

            <span class="control-value" data-value="cameraFov"> 40° </span>

            <input
              type="range"
              min="20"
              max="80"
              step="1"
              data-setting="cameraFov"
            />
          </label>
        </section>
      </div>
    </aside>

    <script type="module" src="./script.js"></script>
  </body>
</html>
