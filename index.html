<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Three.js Firework</title>

    
    <script type="module" crossorigin src="./assets/index-bf1b170c.js"></script>
    <link rel="stylesheet" href="./assets/index-0996f900.css">
  </head>

  <body>
    <canvas class="webgl"></canvas>

    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <aside class="controls-panel">
      <button
        class="controls-toggle"
        type="button"
        aria-label="Toggle controls"
      >
        <span class="controls-toggle-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 6H20M4 12H20M4 18H20"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span>Controls</span>
        <span class="controls-arrow" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <div class="controls-content">
        <!-- =================================================
             ACTIONS
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Actions</span>
          </div>

          <button class="reset-firework control-button primary" type="button">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M20 11A8 8 0 1 0 18 16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M20 5V11H14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Reset
          </button>
        </section>

        <!-- =================================================
             ANIMATION
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Animation</span>
          </div>

          <label class="control-row">
            <span class="control-label">Fade before end</span>

            <span class="control-value" data-value="fadeOutBeforeEnd">
              0.80s
            </span>

            <input
              type="range"
              min="0"
              max="1.4"
              step="0.05"
              data-setting="fadeOutBeforeEnd"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Drop delay</span>

            <span class="control-value" data-value="maxDropDelay"> 0.00s </span>

            <input
              type="range"
              min="0"
              max="0.2"
              step="0.01"
              data-setting="maxDropDelay"
            />
          </label>
        </section>

        <!-- =================================================
             SHAPE
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Shape</span>
          </div>

          <label class="control-row">
            <span class="control-label">Min radius</span>

            <span class="control-value" data-value="minRadius"> 2.70 </span>

            <input
              type="range"
              min="2"
              max="5"
              step="0.05"
              data-setting="minRadius"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Max radius</span>

            <span class="control-value" data-value="maxRadius"> 3.30 </span>

            <input
              type="range"
              min="2"
              max="6"
              step="0.05"
              data-setting="maxRadius"
            />
          </label>

          <label class="control-row">
            <span class="control-label">Target offset</span>

            <span class="control-value" data-value="targetOffset"> 0.35 </span>

            <input
              type="range"
              min="0"
              max="2"
              step="0.01"
              data-setting="targetOffset"
            />
          </label>
        </section>

        <!-- =================================================
             PARTICLES
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Particles</span>
          </div>

          <label class="control-row">
            <span class="control-label">Particle size</span>

            <span class="control-value" data-value="particleSize"> 70 </span>

            <input
              type="range"
              min="1"
              max="150"
              step="1"
              data-setting="particleSize"
            />
          </label>
        </section>

        <!-- =================================================
             CAMERA
             ================================================= -->

        <section class="control-section">
          <div class="section-title">
            <span>Camera</span>
          </div>

          <label class="control-row">
            <span class="control-label">Field of view</span>

            <span class="control-value" data-value="cameraFov"> 40° </span>

            <input
              type="range"
              min="20"
              max="80"
              step="1"
              data-setting="cameraFov"
            />
          </label>
        </section>
      </div>
    </aside>

    
  </body>
</html>
